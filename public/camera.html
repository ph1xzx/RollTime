<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ROLLTIME — Kamera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
<style>body{background:#000;overflow:hidden}</style>
</head>
<body>
<div class="cam-root">
  <div class="cam-stage">
    <canvas class="gl" id="glCanvas"></canvas>
    <div class="cam-top">
      <div class="ev" id="camEvName">ROLLTIME</div>
      <div class="shots"><span data-i18n="cam.shots">JATAH</span> <span id="shotsLeft" style="color:#FF8C2E">—</span></div>
    </div>
    <div class="date-stamp" id="dateStamp"></div>
    <div class="cam-msg hidden" id="camMsg"></div>
    <div class="cam-fx" id="fxRow"></div>
    <div class="cam-done hidden" id="camDone">
      <h2 data-i18n="cam.roll.1"></h2>
      <p data-i18n="cam.roll.2"></p>
      <a class="btn" id="doneGalleryBtn"></a>
    </div>
  </div>
  <div class="cam-bar">
    <button class="cam-icon-btn" id="rotateBtn" data-i18n="cam.switch"></button>
    <button class="shutter" id="shutterBtn" aria-label="shoot"></button>
    <button class="cam-icon-btn" id="uploadBtn" data-i18n="cam.upload"></button>
  </div>
</div>
<div class="cam-flash" id="camFlash"></div>
<input type="file" id="fileInput" accept="image/*" class="hidden">
<script type="module" src="/js/pages/camera.js"></script>
</body>
</html>
