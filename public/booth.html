<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROLLTIME Booth — Strip Foto Instant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="page">
<main class="pane booth-home" style="flex:1">

  <!-- SETUP -->
  <section id="boothSetup">
    <h1 style="margin-bottom:8px" data-i18n="bt.h"></h1>
    <p style="color:var(--ink-soft);font-size:14px;max-width:52ch" data-i18n="bt.sub"></p>

    <div class="tag" style="margin-top:26px;opacity:.6" data-i18n="bt.layout"></div>
    <div class="booth-opts" id="layRow"></div>

    <div class="tag" style="opacity:.6" data-i18n="bt.frame"></div>
    <div class="booth-opts" id="frameRow"></div>

    <div class="tag" style="opacity:.6" data-i18n="bt.fx"></div>
    <div class="fx-pick-row" id="fxRow" style="margin-top:14px"></div>

    <button class="btn big" id="startBtn" data-i18n="bt.start"></button>
    <div class="help" style="margin-top:14px" data-i18n="bt.tip"></div>
  </section>

  <!-- SHOOT -->
  <section id="boothShoot" class="hidden">
    <div class="booth-stage">
      <div style="position:relative;background:#000;min-height:420px">
        <canvas id="glCanvas" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></canvas>
        <div class="cam-count hidden" id="countNum"></div>
        <div class="cam-msg hidden" id="camMsg" style="top:10%"></div>
        <div style="position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:16px;align-items:center">
          <button class="cam-icon-btn" id="rotateBtn" data-i18n="cam.switch"></button>
          <button class="shutter" id="shootBtn" aria-label="shoot"></button>
          <button class="cam-icon-btn" id="cancelBtn">✕</button>
        </div>
      </div>
      <div class="booth-right">
        <div class="tag-mono" style="opacity:.6"><span data-i18n="bt.next"></span> <b id="slotLabel" style="color:var(--orange)">1/4</b></div>
        <div class="slot-row" id="slotRow"></div>
        <div class="help" data-i18n="bt.tip"></div>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="boothResult" class="hidden">
    <h2 style="font-size:clamp(26px,4vw,44px);font-weight:900;text-transform:uppercase;margin-bottom:10px" data-i18n="bt.done"></h2>
    <div class="strip-result">
      <div id="stripHolder"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="dlBtn" data-i18n="bt.dl"></button>
        <button class="btn ghost" id="againBtn" data-i18n="bt.again"></button>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/pages/booth.js"></script>
</body>
</html>
