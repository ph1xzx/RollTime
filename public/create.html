<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLTIME — Buat Kamera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="page">
<main class="pane" style="flex:1">
  <div class="wizard">
    <div class="steps-bar" id="stepsBar"></div>
    <div class="err hidden" id="wizErr"></div>

    <!-- STEP 0: tipe -->
    <section class="step" data-step="0">
      <h1 style="margin-bottom:22px" data-i18n="cr.t0"></h1>
      <div class="type-grid" id="typeGrid"></div>
      <div class="wiz-nav"><span></span><button class="btn" data-go="1" data-i18n="cr.next"></button></div>
    </section>

    <!-- STEP 1: nama + waktu -->
    <section class="step" data-step="1">
      <h1 style="margin-bottom:22px" data-i18n="cr.t1"></h1>
      <div class="field"><label data-i18n="cr.evname"></label><input id="fName" data-i18n-ph="cr.evname.ph"></div>
      <div class="field">
        <label data-i18n="cr.code"></label>
        <input id="fCode" data-i18n-ph="cr.code.ph" style="font-family:var(--mono)">
        <span class="help">rolltime.app/e/<b id="codePrev">xxxxx</b></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="field"><label data-i18n="cr.when"></label><input id="fStart" type="datetime-local"></div>
        <div class="field"><label data-i18n="cr.end"></label><input id="fEnd" type="datetime-local"></div>
      </div>
      <div class="field">
        <label data-i18n="cr.reveal"></label>
        <select id="fReveal">
          <option value="after2" data-i18n="cr.rv.after" selected></option>
          <option value="end" data-i18n="cr.rv.end"></option>
          <option value="instant" data-i18n="cr.rv.instant"></option>
        </select>
      </div>
      <div class="wiz-nav"><button class="btn ghost" data-go="0" data-i18n="cr.back"></button><button class="btn" data-go="2" data-i18n="cr.next"></button></div>
    </section>

    <!-- STEP 2: efek -->
    <section class="step" data-step="2">
      <h1 style="margin-bottom:22px" data-i18n="cr.t2"></h1>
      <div class="field"><label data-i18n="cr.fx"></label><span class="help" data-i18n="cr.fx.help"></span></div>
      <div class="fx-pick-row" id="fxRow"></div>
      <div class="wiz-nav"><button class="btn ghost" data-go="1" data-i18n="cr.back"></button><button class="btn" data-go="3" data-i18n="cr.next"></button></div>
    </section>

    <!-- STEP 3: jatah -->
    <section class="step" data-step="3">
      <h1 style="margin-bottom:22px" data-i18n="cr.t3"></h1>
      <div class="field"><label data-i18n="cr.shots"></label>
        <div class="stepper">
          <button id="shotMinus">−</button>
          <div class="val" id="shotVal">10</div>
          <button id="shotPlus">+</button>
        </div>
      </div>
      <div class="wiz-nav"><button class="btn ghost" data-go="2" data-i18n="cr.back"></button><button class="btn" id="btnCreate" data-i18n="cr.create"></button></div>
    </section>
  </div>
</main>
<script type="module" src="/js/pages/create.js"></script>
</body>
</html>
