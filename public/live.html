<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLTIME — Live Wall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="lv">
<div class="lv-head">
  <img class="qr" id="lvQr" alt="QR" src="">
  <div>
    <div class="name" id="lvName">ROLLTIME</div>
    <div class="cnt"><span id="lvCount">0</span> <span data-i18n="lv.photos">FOTO MASUK</span></div>
  </div>
  <div class="clock"><span id="lvClock">00:00</span><br><span style="font-size:.5em;color:#888;letter-spacing:.2em" data-i18n="lv.live">LIVE WALL</span></div>
</div>

<div class="lv-wait hidden" id="lvWait">
  <div class="big" id="lvWaitBig">MENUNGGU<br>FOTO PERTAMA…</div>
  <div class="sub">SCAN QR DI ATAS → MOTRET DARI HP</div>
</div>
<div class="lv-wait hidden" id="lvNoHost">
  <div class="big" data-i18n="lv.needhost.big">KHUSUS HOST</div>
  <div class="sub" data-i18n="lv.needhost.sub">Login sebagai pemilik acara di device ini, atau buka dari tombol “Live wall” di halaman manage.</div>
</div>

<div class="lv-grid" id="lvGrid"></div>

<div class="lv-foot"><div class="track" id="lvTrack"></div></div>

<script type="module" src="/js/pages/live.js"></script>
</body>
</html>
