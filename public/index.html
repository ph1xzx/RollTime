<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLTIME — Kamera Sekali Pakai Untuk Semua Orang</title>
<meta name="description" content="Satu QR di tiap meja. Tamu motret dari HP sendiri. Hasilnya kebuka bareng-bareng setelah acara. + Photobooth strip viral.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="page">

<!-- HERO -->
<header class="hero">
  <h1 class="headline">
    <span class="row" data-i18n="hero.l1"></span>
    <span class="row outline" data-i18n="hero.l2"></span>
    <span class="row"><span class="accent" data-i18n="hero.l3"></span></span>
  </h1>
  <div class="sub">
    <p data-i18n="hero.sub"></p>
    <div class="hero-sub-meta">
      <div data-i18n="hero.meta1"></div>
      <div data-i18n="hero.meta2"></div>
      <div data-i18n="hero.meta3"></div>
      <div style="margin-top:14px">
        <a class="btn" href="/create" data-i18n="hero.cta"></a>
        <div style="margin-top:10px;opacity:.7" data-i18n="hero.free"></div>
      </div>
    </div>
  </div>
  <div class="strip" id="heroStrip"></div>
  <div class="strip-label" data-i18n="strip.label"></div>
</header>

<!-- MARQUEE -->
<div class="marquee"><div class="track" id="mqTrack"></div></div>

<!-- HOW IT WORKS -->
<section class="section" id="how">
  <div class="section-head">
    <span class="num">01</span><h2 data-i18n="sec.how"></h2><span class="num">RLLT®</span>
  </div>
  <div class="grid-3">
    <div class="cell">
      <span class="k">STEP_01</span>
      <h3 data-i18n="s1.t"></h3>
      <p data-i18n="s1.p"></p>
      <div class="mock">
        <div class="row"><span class="pill">EVENT</span><span class="pill" style="border-color:var(--orange);color:var(--orange)">FILM_04</span></div>
        <input value="Pernikahan Emma & Noah" readonly>
        <div class="row"><span class="tag-mono">REVEAL → 21:00</span><span class="btn-mini">NEXT →</span></div>
      </div>
    </div>
    <div class="cell">
      <span class="k">STEP_02</span>
      <h3 data-i18n="s2.t"></h3>
      <p data-i18n="s2.p"></p>
      <div class="mock">
        <div class="row"><span class="pill">QR</span><span class="tag-mono">scan → shoot</span></div>
        <div style="display:flex;gap:10px;align-items:center">
          <img src="/api/qr.svg?text=https://rolltime.local/e/demo" alt="qr" style="width:64px;height:64px;background:#fff">
          <span class="tag-mono" style="line-height:1.8">no app<br>no signup<br>just shoot</span>
        </div>
      </div>
    </div>
    <div class="cell">
      <span class="k">STEP_03</span>
      <h3 data-i18n="s3.t"></h3>
      <p data-i18n="s3.p"></p>
      <div class="mock">
        <div class="row"><span class="pill">REVEAL</span><span class="tag-mono">02:59:41</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">
          <div style="aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#dcd7cb,#dcd7cb 6px,#e9e5dc 6px,#e9e5dc 12px)"></div>
          <div style="aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#dcd7cb,#dcd7cb 6px,#e9e5dc 6px,#e9e5dc 12px)"></div>
          <div style="aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#dcd7cb,#dcd7cb 6px,#e9e5dc 6px,#e9e5dc 12px)"></div>
          <div style="aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#dcd7cb,#dcd7cb 6px,#e9e5dc 6px,#e9e5dc 12px)"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- EFFECTS -->
<section class="section" id="fx">
  <div class="section-head">
    <span class="num">02</span><h2 data-i18n="sec.fx"></h2><span class="num" data-i18n="fx.sub" style="max-width:280px;font-family:var(--font);font-size:12px;letter-spacing:.02em;text-transform:none;opacity:.65"></span>
  </div>
  <div class="fx-grid" id="fxGrid"></div>
</section>

<!-- BOOTH PROMO -->
<section class="section" id="boothsec">
  <div class="section-head">
    <span class="num">03</span><h2 data-i18n="sec.booth"></h2><span class="num">NEW</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr">
    <div class="cell" style="padding:36px 24px;display:flex;flex-direction:column;gap:16px;justify-content:center">
      <h3 class="price-big" style="font-size:clamp(28px,3.4vw,46px)" data-i18n="booth.h"></h3>
      <p style="font-size:14px;line-height:1.6;color:var(--ink-soft);max-width:46ch" data-i18n="booth.p"></p>
      <div><a class="btn" href="/booth" data-i18n="booth.cta"></a></div>
    </div>
    <div style="background:var(--ink);padding:28px;display:flex;gap:14px;justify-content:center;align-items:center;overflow:hidden">
      <div style="background:var(--pink);padding:8px;transform:rotate(-4deg);box-shadow:8px 8px 0 rgba(0,0,0,.4)">
        <img src="/assets/img/sample-2.png" style="width:110px;height:132px;object-fit:cover"><img src="/assets/img/sample-5.png" style="width:110px;height:132px;object-fit:cover;margin-top:6px">
        <div style="text-align:center;font-weight:900;font-size:11px;letter-spacing:.2em;padding-top:6px">ROLLTIME ★</div>
      </div>
      <div style="background:#FFC400;padding:8px;transform:rotate(3deg);box-shadow:8px 8px 0 rgba(0,0,0,.4)">
        <img src="/assets/img/sample-3.png" style="width:110px;height:132px;object-fit:cover"><img src="/assets/img/sample-6.png" style="width:110px;height:132px;object-fit:cover;margin-top:6px">
        <div style="text-align:center;font-weight:900;font-size:11px;letter-spacing:.2em;padding-top:6px">ROLLTIME®</div>
      </div>
    </div>
  </div>
</section>

<!-- PRICING -->
<section class="section" id="price">
  <div class="section-head">
    <span class="num">04</span><h2 data-i18n="sec.price"></h2><span class="num">[ 000 ]</span>
  </div>
  <div class="price-grid">
    <div class="price-cell">
      <div class="price-big"><span class="price-free" data-i18n="price.h1"></span><br><span style="font-size:.45em" data-i18n="price.h2"></span></div>
      <p style="margin-top:20px;font-size:14px;color:var(--ink-soft);max-width:46ch;line-height:1.6" data-i18n="price.point"></p>
      <div style="margin-top:24px"><a class="btn big" href="/create" data-i18n="hero.cta"></a></div>
    </div>
    <div class="price-cell">
      <ul class="checklist">
        <li data-i18n="price.li1"></li>
        <li data-i18n="price.li2"></li>
        <li data-i18n="price.li3"></li>
        <li data-i18n="price.li4"></li>
        <li data-i18n="price.li5"></li>
        <li data-i18n="price.li6"></li>
      </ul>
    </div>
  </div>
</section>

<!-- FAQ -->
<section class="section faq" id="faq">
  <div class="section-head">
    <span class="num">05</span><h2 data-i18n="sec.faq"></h2><span class="num">(+)</span>
  </div>
  <details><summary data-i18n="faq.a1.q"></summary><div class="ans" data-i18n="faq.a1.a"></div></details>
  <details><summary data-i18n="faq.a2.q"></summary><div class="ans" data-i18n="faq.a2.a"></div></details>
  <details><summary data-i18n="faq.a3.q"></summary><div class="ans" data-i18n="faq.a3.a"></div></details>
  <details><summary data-i18n="faq.a4.q"></summary><div class="ans" data-i18n="faq.a4.a"></div></details>
</section>

<script type="module" src="/js/pages/landing.js"></script>
</body>
</html>
