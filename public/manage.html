<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLTIME — Kelola Acara</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF5C00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="page">
<main class="pane" style="flex:1">
  <div id="load" class="tag-mono" data-i18n="common.loading"></div>
  <div id="content" class="hidden">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:26px">
      <div>
        <h1 id="evName" style="margin-bottom:8px"></h1>
        <div class="tag-mono" id="evMeta" style="opacity:.65"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn ghost" id="guestLink" target="_blank"></a>
        <a class="btn" href="/app" data-i18n="mg.to.dash"></a>
      </div>
    </div>

    <div class="manage-grid">
      <div>
        <div class="qr-card">
          <div class="tag" data-i18n="mg.link"></div>
          <img id="qrImg" alt="QR">
          <div class="tag-mono" id="qrCode" style="color:var(--orange)"></div>
          <button class="btn ghost" style="padding:10px 18px;font-size:11px" id="dlQr" data-i18n="mg.dlqr"></button>
        </div>
        <div class="copyrow">
          <input id="linkInput" readonly>
          <button id="copyBtn" data-i18n="mg.copy"></button>
        </div>
      </div>
      <div>
        <div class="stat-row">
          <div class="stat"><div class="n" id="stGuests">0</div><div class="l" data-i18n="mg.stats.g"></div></div>
          <div class="stat"><div class="n" id="stPhotos">0</div><div class="l" data-i18n="mg.stats.p"></div></div>
          <div class="stat"><div class="n" id="stLeft">0</div><div class="l" data-i18n="mg.stats.l"></div></div>
        </div>
        <div class="tag-mono" style="margin-bottom:8px"><span data-i18n="mg.locked"></span>: <span id="revealAt" style="color:var(--orange)"></span></div>
        <div style="display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap">
          <button class="btn ghost" style="padding:10px 18px;font-size:11px" id="refreshBtn" data-i18n="mg.refresh"></button>
          <a class="btn ghost" style="padding:10px 18px;font-size:11px" id="galleryBtn"></a>
          <a class="btn ghost" style="padding:10px 18px;font-size:11px;border-color:var(--orange);color:var(--orange)" id="liveBtn" target="_blank">Live wall ↗</a>
          <button class="btn ghost" style="padding:10px 18px;font-size:11px;border-color:var(--pink);color:var(--pink)" id="deleteBtn" data-i18n="mg.delete"></button>
        </div>
        <div class="tag-mono" style="margin-bottom:10px;opacity:.6" data-i18n="mg.guests"></div>
        <div class="ev-list" id="guestList"></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/js/pages/manage.js"></script>
</body>
</html>
